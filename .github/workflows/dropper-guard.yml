name: Dropper guard

# Catches the four things that let a committed dropper reach a developer's
# machine. Each check corresponds to something that actually got through:
#   1. .vscode/ committed at all -- editor config is executable config
#   2. folderOpen / allowAutomaticTasks -- silent execution on folder open
#   3. a single absurdly long line -- how the payload hides off-screen
#   4. an asset whose magic bytes contradict its extension -- the fake .woff2

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Editor configuration must not be committed
        run: |
          files=$(git ls-files '.vscode/*' '**/.vscode/*')
          if [ -n "$files" ]; then
            echo "::error::.vscode/ is committed. Editor configuration is executable configuration and does not belong in a shared repository."
            echo "$files"
            exit 1
          fi

      - name: No auto-executing editor tasks
        run: |
          hits=$(git grep -lIE 'runOn"?[[:space:]]*:[[:space:]]*"?folderOpen|task\.allowAutomaticTasks' -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::folderOpen task or allowAutomaticTasks found. These execute code when the folder is opened, with no prompt."
            echo "$hits"
            exit 1
          fi

      - name: No hidden payload on an over-long line
        run: |
          # Only TEXT files can hide a JS payload. grep -I reports no match on a
          # binary file, so this skips .bin/.db/.jar/images without needing an
          # extension list -- an extension list missed chroma_db/*.bin first time.
          bad=""
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            grep -Iq . "$f" 2>/dev/null || continue          # binary -> skip
            case "$f" in
              *.min.js|*.min.css|*.map|*.lock|*-lock.json|*.log) continue ;;
              node_modules/*|*/node_modules/*|dist/*|*/dist/*|build/*|*/build/*|vendor/*|*/vendor/*) continue ;;
            esac
            hit=$(awk 'length($0) > 20000 { printf "%s: line %d is %d chars", FILENAME, FNR, length($0); exit }' "$f")
            [ -n "$hit" ] && bad="$bad$hit\n"
          done < <(git ls-files)
          if [ -n "$bad" ]; then
            echo "::error::File(s) contain a single line over 20,000 characters -- the signature used to push an obfuscated payload off the right edge of the editor."
            printf "%b" "$bad"
            exit 1
          fi

      - name: Assets must not actually be text
        run: |
          # The payload was JavaScript named .woff2, padded with tabs/spaces, so
          # its first bytes were whitespace instead of a binary signature. Only
          # flag an asset that is TEXT -- a .png that is really a .jpg is a
          # harmless mislabel and is not what this is looking for.
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if grep -Iq . "$f" 2>/dev/null; then
              echo "  $f: declared a binary asset but its contents are text"
              head -c 80 "$f" | od -c | head -2
              fail=1
            fi
          done < <(git ls-files -- '*.woff2' '*.woff' '*.ttf' '*.otf' '*.eot' '*.png' '*.gif' '*.pdf' '*.jpg' '*.jpeg' '*.ico')
          if [ "$fail" -ne 0 ]; then
            echo "::error::Asset(s) contain text, not binary data -- this is how executable JavaScript was disguised as a font."
            exit 1
          fi
